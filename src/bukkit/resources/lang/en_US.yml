# BasicStatusCommand legacy language file (English)
# The legacy line uses & color codes (1.8.8 - 1.18.1, bukkit jar)
# Placeholders use braces: {player} {ping} {value} {seconds} ...

prefix: "&8[&bBasicStatusCmd&8] &r"

general:
  no-permission: "&cYou do not have permission to use this command."
  player-not-found: "&cPlayer &f{player} &cis not online."
  console-needs-player: "&cSpecify a player name when running ping from the console."
  unknown-arg: "&cUnknown argument &f{sub}&c. Use &f/basicstatuscmd &cfor help."
  reloaded: "&aConfig and language files reloaded."

help:
  header: "&b{version}"
  entry: "&8/&f{command} &8- &7{desc}"
  reload: "&8/&f{command} reload &8- &7{desc}"

desc:
  basicstatuscmd: "Show the status command list"
  reload: "Reload config and language files"
  ping: "Show your own or another player's latency"
  traffic: "Show server packet send/receive rates"
  top: "Top 5 players by latency"
  tps: "Show 1/5/15 minute TPS"
  cpu: "Show JVM process CPU usage"
  mem: "Show heap and physical memory usage"
  gc: "Show garbage collection counts and time"
  thread: "Show active JVM thread count"
  entity: "Count entities by category"
  chunk: "Count loaded chunks"
  info: "Show basic server information"
  env: "Show runtime / Java / OS information"
  disk: "Show free disk space"
  check: "Run a one-shot health check"

ping:
  entry-good: "&7{player} &8- &a{ping} ms &8(&aGood&8)"
  entry-medium: "&7{player} &8- &e{ping} ms &8(&eFair&8)"
  entry-bad: "&7{player} &8- &c{ping} ms &8(&cPoor&8)"
  entry-unknown: "&7{player} &8- &7Latency unknown"
  world: "&7World: &f{world}"

traffic:
  sampling: "&7Sampling for &f{seconds} &7seconds..."
  line-window: "&7Window: &f{seconds}s &8| &7Channels: &f{channels}"
  line-down: "&7Down: &a{rate} &8(&f{packets} pkt/s&8)"
  line-up: "&7Up: &e{rate} &8(&f{packets} pkt/s&8)"
  line-total: "&7Total: &fdown {in} &7/ &fup {out}"
  no-players: "&7No players online; traffic is reported as zero."
  no-channel: "&eNo player channel was instrumented (this server may use a different Netty layout); showing zeros."

top:
  entry-good: "&7#{rank} &f{player} &8- &a{ping} ms"
  entry-medium: "&7#{rank} &f{player} &8- &e{ping} ms"
  entry-bad: "&7#{rank} &f{player} &8- &c{ping} ms"
  entry-unknown: "&7#{rank} &f{player} &8- &7unknown"
  empty: "&7No players are online."

tps:
  label-1m: "1 minute"
  label-5m: "5 minutes"
  label-15m: "15 minutes"
  line: "&7{label}: {color}{value}"
  warming: "&7{label}: &8warming up &7({seconds}s)"
  collecting: "&7TPS: &8still collecting, try again later"
  native-missing: "&7TPS: &8this server has no TPS API"
  mspt: "&7MSPT: {color}{value} ms"

cpu:
  label-process: "Process CPU"
  label-system: "System CPU"
  process: "&7Process CPU: {color}{value}%"
  system: "&7System CPU: {color}{value}%"
  cores: "&7Processors: &f{value}"
  load: "&7System load: &f{value}"
  unavailable: "&7{label}: &8unavailable"

mem:
  heap: "&7Heap: {color}{used} &7/ &f{max} &8({color}{percent}%&8)"
  nonheap: "&7Non-heap: &f{used}"
  physical: "&7Physical: &f{used} &7/ &f{total} &8({percent}%&8)"

gc:
  entry: "&7{name}: &f{count} collections &7/ &f{time} ms"
  total: "&7Total: &f{count} collections &7/ &f{time} ms &8({percent}% of uptime&8)"

thread:
  live: "&7Live threads: &f{value}"
  peak: "&7Peak threads: &f{value}"
  daemon: "&7Daemon threads: &f{value}"
  started: "&7Started: &f{value}"

entity:
  total: "&7Total entities: &f{value}"
  category: "&7By category: &cMonster {monster} &7| &aAnimals {animals} &7| &bWater {water} &7| &eVillager {villager} &7| &7Other {other}"
  world: "&7{world}: &f{total} &8(&cM {monster} &8/ &aA {animals} &8/ &7O {other}&8)"
  more-worlds: "&7... {count} more worlds not shown"

chunk:
  total: "&7Loaded chunks: &f{value}"
  world: "&7{world}: &f{value}"

info:
  server: "&7Server: &f{name}"
  version: "&7Version: &f{version}"
  bukkit: "&7Bukkit: &f{version}"
  players: "&7Players: &f{online} &7/ &f{max}"
  worlds: "&7Worlds: &f{worlds} &7| &7Plugins: &f{plugins}"
  uptime: "&7Uptime: &f{value}"
  java: "&7JVM: &f{version} &8({vendor}&8)"

env:
  java: "&7Java: &f{version} &8({vendor}&8)"
  vm: "&7VM: &f{name} &8({version}&8)"
  os: "&7OS: &f{name} &8({arch}&8) &f{version}"
  cores: "&7CPU cores: &f{value}"
  misc: "&7Encoding: &f{encoding} &7| &7Timezone: &f{timezone}"
  dir: "&7Server dir: &f{value}"

disk:
  root: "&7{root} &8free {color}{free} &8/ &f{total} &8({percent}% used&8)"
  data: "&7Server dir: &f{path}"

check:
  ok: "&aOK"
  warn: "&e!"
  fail: "&cX"
  item: "{status} &7{label}: &f{value}"
  threshold: "&8(threshold {value}&8)"
  collecting: "collecting"
  label-tps: "TPS"
  label-memory: "Memory"
  label-disk: "Disk"
  label-free: "free"
  label-chunk: "Chunks"
  label-entity: "Entities"
  label-thread: "Threads"
  label-gc: "GC time"
  summary-ok: "&aNo issues found across {count} checks."
  summary-warn: "&e{count} item(s) need attention."
